name: Documentarian
version: 0.2.40
slug: documentarian
description: Find, organize, search, and answer questions from appliance and machine manuals.
url: https://github.com/EiNSTeiN-/hass-documentarian-addon
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
timeout: 30
ingress: true
ingress_port: 8099
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
    path: /config
panel_title: Documentarian
panel_icon: mdi:file-document-multiple-outline
panel_admin: false
stage: experimental
watchdog: http://[HOST]:[PORT:8099]/addon-health
backup: cold
options:
  openai_api_key: ""
  openai_model: gpt-6.1-sol
  openai_model_options: gpt-6.1-sol,gpt-6-astra,gpt-6.1-terra,gpt-6-sol,gpt-6-luna
  openai_reasoning_effort: high
  openai_chat_reasoning_efforts: none,minimal,low,medium,high,xhigh
  openai_methodology_reasoning_efforts: minimal,low,medium,high,xhigh
  openai_methodology_reasoning_effort: medium
  openai_subagent_reasoning_efforts: low,medium,high
  openai_subagent_reasoning_effort: high
  openai_compaction_threshold_ratio: 0.8
  openai_prompt_cache_key_enabled: true
  openai_prompt_cache_retention: ""
  openai_text_verbosity: medium
  openai_tool_search_enabled: true
  openai_source_discovery_enabled: true
  openai_source_discovery_model: gpt-5.4-mini
  openai_link_discovery_enabled: true
  openai_link_discovery_model: gpt-5.4-mini
  openai_live_url_inspection_enabled: true
  openai_live_url_inspection_model: gpt-5.4-mini
  openai_live_url_inspection_reasoning_effort: low
  home_assistant_mcp_url: ""
  home_assistant_mcp_auto_detect: true
  workbench_mcp_proxy_enabled: false
  workbench_mcp_proxy_remote_url: ""
  workbench_mcp_proxy_debug_logging: false
  workbench_mcp_proxy_regenerate_webhook: false
  conversation_title_model: gpt-5.6-luna
  conversation_title_reasoning_effort: low
  conversation_title_max_output_tokens: 1024
  max_attachment_bytes: 150000000
  max_downloaded_source_bytes: 157286400
  max_plain_text_source_bytes: 16777216
  max_html_source_bytes: 1048576
  max_import_archive_bytes: 2147483648
  max_import_uncompressed_bytes: 8589934592
  max_import_manifest_bytes: 16777216
  max_import_member_bytes: 2147483648
  max_import_members: 50000
  max_import_compression_ratio: 100.0
  max_inbound_transfers: 2
  max_source_ingestions: 1
  max_archive_workers: 1
  max_resource_workers: 2
  max_import_upload_chunk_bytes: 16777216
  max_resource_records: 4096
  max_metadata_catalog_generation_bytes: 268435456
  max_package_materialization_pairs: 8
  max_materialized_package_bytes: 524288
  max_multipart_overhead_bytes: 1048576
  http_upload_spool_memory_bytes: 1048576
  max_resource_memory_bytes: 1073741824
  max_source_ingest_memory_reservation_bytes: 536870912
  max_archive_metadata_bytes: 67108864
  max_archive_metadata_multiplier: 4
  max_import_member_name_bytes: 1024
  max_manifest_json_depth: 32
  max_manifest_string_bytes: 8192
  max_manifest_container_items: 50000
  min_resource_temp_free_bytes: 1073741824
  resource_lease_heartbeat_seconds: 10.0
  resource_lease_expiry_seconds: 60.0
  log_level: info
schema:
  openai_api_key: password
  openai_model: str
  openai_model_options: str
  openai_reasoning_effort: list(none|minimal|low|medium|high|xhigh)
  openai_chat_reasoning_efforts: str
  openai_methodology_reasoning_efforts: str
  openai_methodology_reasoning_effort: list(minimal|low|medium|high|xhigh)
  openai_subagent_reasoning_efforts: str
  openai_subagent_reasoning_effort: list(low|medium|high)
  openai_default_context_window_tokens: int(1,)
  openai_compaction_threshold_ratio: float
  openai_prompt_cache_key_enabled: bool
  openai_prompt_cache_retention: list(|in_memory|24h)
  openai_text_verbosity: list(low|medium|high)
  openai_tool_search_enabled: bool
  openai_source_discovery_enabled: bool
  openai_source_discovery_model: str
  openai_link_discovery_enabled: bool
  openai_link_discovery_model: str
  openai_live_url_inspection_enabled: bool
  openai_live_url_inspection_model: str
  openai_live_url_inspection_reasoning_effort: list(low|medium|high)
  home_assistant_mcp_url: password
  home_assistant_mcp_auto_detect: bool
  workbench_mcp_proxy_enabled: bool
  workbench_mcp_proxy_remote_url: str
  workbench_mcp_proxy_debug_logging: bool
  workbench_mcp_proxy_regenerate_webhook: bool
  conversation_title_model: str
  conversation_title_reasoning_effort: list(low|medium|high)
  conversation_title_max_output_tokens: int(1,)
  durable_json_max_bytes: int(1,67108864)?
  durable_record_decode_concurrency: int(1,)?
  max_attachment_bytes: int(1,)
  max_downloaded_source_bytes: int(1,)
  max_plain_text_source_bytes: int(1,)
  max_html_source_bytes: int(1,)
  max_import_archive_bytes: int(1,)
  max_import_uncompressed_bytes: int(1,)
  max_import_manifest_bytes: int(1,)
  max_import_member_bytes: int(1,)
  max_import_members: int(1,)
  max_import_compression_ratio: float
  max_inbound_transfers: int(1,)
  max_source_ingestions: int(1,)
  max_archive_workers: int(1,)
  max_resource_workers: int(1,)
  max_import_upload_chunk_bytes: int(1,)
  max_resource_records: int(1,)
  max_metadata_catalog_generation_bytes: int(16777216,4294967296)
  max_package_materialization_pairs: int(1,64)
  max_materialized_package_bytes: int(65536,33554432)
  max_multipart_overhead_bytes: int(1,)
  http_upload_spool_memory_bytes: int(1,)
  max_resource_memory_bytes: int(1,)
  max_source_ingest_memory_reservation_bytes: int(1,)
  max_archive_metadata_bytes: int(1,)
  max_archive_metadata_multiplier: int(1,)
  max_import_member_name_bytes: int(1,)
  max_manifest_json_depth: int(1,)
  max_manifest_string_bytes: int(1,)
  max_manifest_container_items: int(1,)
  min_resource_temp_free_bytes: int(0,)
  resource_lease_heartbeat_seconds: float
  resource_lease_expiry_seconds: float
  log_level: list(debug|info|warning|error)
image: "ghcr.io/einstein-docker/hass-documentarian-addon"
